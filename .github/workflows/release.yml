name: CopperBarsOS Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
      SOURCE_DATE_EPOCH: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            qemu-system-x86 qemu-utils ovmf shellcheck python3

      - name: Validate version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "${GITHUB_REF_NAME}" == v* && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match VERSION $VERSION" >&2
            exit 1
          fi

      - name: Validate build inputs
        run: |
          set -euo pipefail
          test -x build.sh
          test -x tools/build-update-bundle.sh
          bash -n build.sh
          bash -n tools/build-update-bundle.sh
          find config/hooks config/includes.chroot/usr/local/bin -type f -print0 | xargs -0 -n1 sh -n
          shellcheck build.sh tools/build-update-bundle.sh
          python3 -m compileall -q config/includes.chroot/opt/copperbars
          python3 -m json.tool config/includes.chroot/opt/copperbars/apps.json >/dev/null

      - name: Build ISO
        run: sudo ./build.sh

      - name: Build GitHub update bundle
        run: sudo ./tools/build-update-bundle.sh

      - name: Normalize artifact ownership
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Verify artifacts
        run: |
          set -euo pipefail
          test -s dist/CopperBarsOS-x86_64.iso
          test -s dist/CopperBarsOS-x86_64.iso.sha256
          test -s dist/CopperBarsOS-*-update.tar.gz
          test -s dist/CopperBarsOS-*-update.tar.gz.sha256
          sha256sum -c dist/CopperBarsOS-x86_64.iso.sha256
          for file in dist/CopperBarsOS-*-update.tar.gz; do
            sha256sum -c "$file.sha256"
          done
          xorriso -indev dist/CopperBarsOS-x86_64.iso -toc >/tmp/copperbarsos-release-toc.txt
          test -s /tmp/copperbarsos-release-toc.txt

      - name: Boot smoke test (BIOS)
        run: |
          set +e
          timeout 60s qemu-system-x86_64 \
            -machine accel=tcg:tcg \
            -m 2048 \
            -smp 2 \
            -cdrom dist/CopperBarsOS-x86_64.iso \
            -boot d \
            -display none \
            -serial stdio
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CopperBarsOS-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/CopperBarsOS-x86_64.iso
            dist/CopperBarsOS-x86_64.iso.sha256
            dist/CopperBarsOS-*-update.tar.gz
            dist/CopperBarsOS-*-update.tar.gz.sha256
          retention-days: 14

      - name: Publish GitHub release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "CopperBarsOS $VERSION" \
            --generate-notes \
            dist/CopperBarsOS-x86_64.iso \
            dist/CopperBarsOS-x86_64.iso.sha256 \
            dist/CopperBarsOS-${VERSION}-update.tar.gz \
            dist/CopperBarsOS-${VERSION}-update.tar.gz.sha256
